[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "test-game"
version = "0.1.0"
description = "A test game written in Python"
requires-python = ">=3.10"
dependencies = [
    "furo>=2025.12.19",
    "pytest>=9.1.0",
    "pytest-cov>=7.1.0",
    "sphinx>=9.0.0"
]

[tool.setuptools]
packages = ["game"]

[tool.pytest.ini_options]
testpaths = ["game/tests"]